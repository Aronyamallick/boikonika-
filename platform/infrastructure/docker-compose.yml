# Boikonika on one server: PostgreSQL, Redis, the API, the website and Nginx.
# Uploads live on the `uploads` volume (local storage driver); to use S3 / Cloudflare R2 instead, set
# STORAGE_DRIVER=s3 and the S3_* values in .env (see docs/deployment.md).
#   cp infrastructure/.env.example infrastructure/.env   # then fill in every secret
#   docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env build
#   docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env run --rm migrate
#   docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env up -d
# For local development use docker-compose.dev.yml (just PostgreSQL and Redis).
name: boikonika

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  APP_URL: ${SITE_URL}
  API_URL: ${SITE_URL}
  CORS_ORIGINS: ${SITE_URL}
  TRUST_PROXY: 'true'
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /app/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-boikonika-public}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-boikonika-private}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  MAIL_DRIVER: smtp
  SMTP_HOST: '${SMTP_HOST:?set SMTP_HOST, production sends sign-up codes and receipts by email}'
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-Boikonika <no-reply@boikonika.com>}
  SMS_DRIVER: ${SMS_DRIVER:-log}
  SMS_API_URL: ${SMS_API_URL:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_SENDER_ID: ${SMS_SENDER_ID:-}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  BKASH_BASE_URL: ${BKASH_BASE_URL:-}
  BKASH_APP_KEY: ${BKASH_APP_KEY:-}
  BKASH_APP_SECRET: ${BKASH_APP_SECRET:-}
  BKASH_USERNAME: ${BKASH_USERNAME:-}
  BKASH_PASSWORD: ${BKASH_PASSWORD:-}
  SSLCOMMERZ_BASE_URL: ${SSLCOMMERZ_BASE_URL:-}
  SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
  SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm migrate` applies migrations and reference data (safe to repeat).
  migrate:
    image: boikonika-api
    build: { context: .., dockerfile: infrastructure/docker/api.Dockerfile }
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    working_dir: /app/database
    command: ['sh', '-c', 'node dist/migrate.js && node dist/seed/index.js']

  api:
    image: boikonika-api
    build: { context: .., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *api-env
    volumes: [uploads:/app/storage]

  web:
    image: boikonika-web
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_API_URL: ${SITE_URL}
        NEXT_PUBLIC_ASSETS_URL: ${S3_PUBLIC_BASE_URL:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
      SEARCH_INDEXING: ${SEARCH_INDEXING:-on}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports: ['${HTTP_PORT:-80}:80']
    volumes: ['./nginx/boikonika.conf:/etc/nginx/conf.d/default.conf:ro']

volumes:
  postgres-data:
  redis-data:
  uploads:
