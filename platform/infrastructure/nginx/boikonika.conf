# Boikonika behind Nginx: the website, and the API (including uploaded media) under /api/.
# TLS: terminate HTTPS in front of this (a cloud load balancer, Cloudflare, or certbot on the host)
# and forward to port 80 with X-Forwarded-Proto set. The API trusts one proxy hop (TRUST_PROXY=true).

upstream boikonika_web { server web:3000; keepalive 32; }
upstream boikonika_api { server api:4000; keepalive 32; }

# Per-IP request limits in front of the API's own limits (bursts allowed for page loads).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;

  # E-books can be up to 50 MB; other uploads are smaller (the API enforces each limit).
  client_max_body_size 60m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    proxy_pass http://boikonika_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  location /_next/static/ {
    proxy_pass http://boikonika_web;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://boikonika_web;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
