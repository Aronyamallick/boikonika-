<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>অফলাইন · Offline — বইকণিকা</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --fg: #0f172a; --muted: #64748b; --primary: #2563eb; --line: #e2e8f0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --fg: #f1f5f9; --muted: #94a3b8; --primary: #60a5fa; --line: #334155; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 26rem; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 1.35rem; margin: 16px 0 6px; }
      p { margin: 0 0 6px; color: var(--muted); line-height: 1.6; }
      .en { font-size: 0.95rem; }
      button { margin-top: 18px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>আপনি এখন অফলাইনে আছেন</h1>
      <p>ইন্টারনেট সংযোগ ফিরলে পাতাটি আবার খুলুন।</p>
      <p class="en" lang="en">You're offline. Reconnect to the internet and try again.</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন · Try again</button>
    </main>
  </body>
</html>
